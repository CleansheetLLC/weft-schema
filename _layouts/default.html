<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <h1 class="project-name"><a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title }}</a></h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      <a href="{{ '/SPEC.html' | relative_url }}" class="btn">Specification</a>
      <a href="{{ '/weft.json' | relative_url }}" class="btn">weft.json</a>
      <a href="https://github.com/CleansheetLLC/weft-schema" class="btn">GitHub</a>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">The Weft Schema is stewarded by Cleansheet LLC and licensed <a href="{{ '/LICENSE' | relative_url }}">CC BY 4.0</a>.</span>
        <span class="site-footer-credits">DOI <a href="https://doi.org/10.5281/zenodo.21806130">10.5281/zenodo.21806130</a></span>
      </footer>
    </main>
  </body>
</html>
